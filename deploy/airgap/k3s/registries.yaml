# Example /etc/rancher/k3s/registries.yaml for showroom airgap mode.
#
# The Zot service runs on the fixed master workstation at 10.88.0.10:5000.
# Images must be preloaded under the same prefixed paths used below, for example:
#   10.88.0.10:5000/ghcr.io/amdresearch/auplc-hub:latest
#   10.88.0.10:5000/registry.k8s.io/pause:3.10.1

mirrors:
  docker.io:
    endpoint:
      - "http://10.88.0.10:5000/docker.io"
  ghcr.io:
    endpoint:
      - "http://10.88.0.10:5000/ghcr.io"
  quay.io:
    endpoint:
      - "http://10.88.0.10:5000/quay.io"
  registry.k8s.io:
    endpoint:
      - "http://10.88.0.10:5000/registry.k8s.io"
