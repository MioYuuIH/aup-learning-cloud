# Showroom offline overlay.
#
# Use this mode when the exhibition must run without internet access. GitHub
# OAuth and Cloudflare are not required for the local Wi-Fi entrypoint; use the
# native demo accounts on the login page.
#
# Deploy with:
#   helm upgrade --install jupyterhub ./chart -n jupyterhub --create-namespace \
#     -f values.yaml -f values.showroom-offline.yaml

custom:
  authMode: "multi"
  githubOrgName: ""

  hub:
    allowedOrigins:
      - "http://10.88.0.10:30890"
      - "http://aup.local"
  notebook:
    allowedOrigins:
      - "http://10.88.0.10:30890"
      - "http://aup.local"

  gitClone:
    githubAppName: ""
    defaultAccessToken: ""

  quota:
    enabled: true
    defaultQuota: 999999

hub:
  config:
    JupyterHub:
      redirect_to_server: false
      load_users:
        admin:
          admin: true
        demo01: {}
        demo02: {}
        demo03: {}
        demo04: {}
        demo05: {}
        demo06: {}
        demo07: {}
        demo08: {}
        demo09: {}
        demo10: {}
        demo11: {}
        demo12: {}
    Authenticator:
      allow_all: true
      admin_users:
        - admin
    # Keep syntactically valid GitHub settings so the multi authenticator can
    # render the page; users should choose the native login path offline.
    GitHubOAuthenticator:
      oauth_callback_url: "http://10.88.0.10:30890/hub/github/oauth_callback"
      client_id: "offline-disabled"
      client_secret: "offline-disabled"
      allowed_organizations: []
      scope: []
    KubeSpawner:
      image_pull_policy: IfNotPresent

  db:
    pvc:
      storageClassName: local-path
  image:
    name: ghcr.io/amdresearch/auplc-hub
    tag: latest
    pullPolicy: IfNotPresent

singleuser:
  extraNodeAffinity:
    required:
      - matchExpressions:
          - key: auplc.node-role
            operator: In
            values:
              - compute
  storage:
    dynamic:
      storageClass: local-path

proxy:
  service:
    type: NodePort
    nodePorts:
      http: 30890
      https: null

ingress:
  enabled: false

prePuller:
  hook:
    enabled: true
    pullOnlyOnChanges: true
  continuous:
    enabled: true
  pullProfileListImages: true
  extraImages:
    auplc-default:
      name: ghcr.io/amdresearch/auplc-default
      tag: latest
    auplc-base:
      name: ghcr.io/amdresearch/auplc-base
      tag: latest
    auplc-cv:
      name: ghcr.io/amdresearch/auplc-cv
      tag: latest
    auplc-dl:
      name: ghcr.io/amdresearch/auplc-dl
      tag: latest
    auplc-llm:
      name: ghcr.io/amdresearch/auplc-llm
      tag: latest
    auplc-physim:
      name: ghcr.io/amdresearch/auplc-physim
      tag: latest
    auplc-hub:
      name: ghcr.io/amdresearch/auplc-hub
      tag: latest
