# Showroom online overlay.
#
# Use this mode when the venue network is available. Users can sign in with
# GitHub through the Cloudflare tunnel, while native demo accounts remain
# available as a fallback on the same login page.
#
# Deploy with:
#   helm upgrade --install jupyterhub ./chart -n jupyterhub --create-namespace \
#     -f values.yaml -f values.showroom-online.yaml

custom:
  authMode: "multi"
  githubOrgName: "<YOUR-GITHUB-ORG>"

  # Cloudflare terminates HTTPS before forwarding to the local Hub endpoint.
  security:
    publicScheme: "https"

  hub:
    allowedOrigins:
      - "https://<YOUR-SHOWROOM-DOMAIN>"
      - "http://10.88.0.10:30890"
      - "http://aup.local"
  notebook:
    allowedOrigins:
      - "https://<YOUR-SHOWROOM-DOMAIN>"
      - "http://10.88.0.10:30890"
      - "http://aup.local"

  gitClone:
    # Leave blank unless the GitHub App repo picker is configured.
    githubAppName: ""
    defaultAccessToken: ""

  quota:
    enabled: true
    defaultQuota: 999999

hub:
  config:
    JupyterHub:
      redirect_to_server: false
      # Pre-created local users let the native login path work even if GitHub
      # becomes unavailable during the exhibition.
      load_users:
        admin:
          admin: true
        demo01: {}
        demo02: {}
        demo03: {}
        demo04: {}
        demo05: {}
        demo06: {}
        demo07: {}
        demo08: {}
        demo09: {}
        demo10: {}
        demo11: {}
        demo12: {}
    Authenticator:
      allow_all: true
      admin_users:
        - admin
    GitHubOAuthenticator:
      oauth_callback_url: "https://<YOUR-SHOWROOM-DOMAIN>/hub/github/oauth_callback"
      client_id: "<GITHUB-OAUTH-CLIENT-ID>"
      client_secret: "<GITHUB-OAUTH-CLIENT-SECRET>"
      allowed_organizations:
        - "<YOUR-GITHUB-ORG>"
      scope:
        - read:user
        - read:org
    KubeSpawner:
      image_pull_policy: IfNotPresent

  db:
    pvc:
      storageClassName: local-path
  image:
    name: ghcr.io/amdresearch/auplc-hub
    tag: latest
    pullPolicy: IfNotPresent

singleuser:
  extraNodeAffinity:
    required:
      - matchExpressions:
          - key: auplc.node-role
            operator: In
            values:
              - compute
  storage:
    dynamic:
      storageClass: local-path

proxy:
  service:
    type: NodePort
    nodePorts:
      http: 30890
      https: null

ingress:
  enabled: false

prePuller:
  hook:
    enabled: true
    pullOnlyOnChanges: true
  continuous:
    enabled: true
  pullProfileListImages: true
  extraImages:
    auplc-default:
      name: ghcr.io/amdresearch/auplc-default
      tag: latest
    auplc-base:
      name: ghcr.io/amdresearch/auplc-base
      tag: latest
    auplc-cv:
      name: ghcr.io/amdresearch/auplc-cv
      tag: latest
    auplc-dl:
      name: ghcr.io/amdresearch/auplc-dl
      tag: latest
    auplc-llm:
      name: ghcr.io/amdresearch/auplc-llm
      tag: latest
    auplc-physim:
      name: ghcr.io/amdresearch/auplc-physim
      tag: latest
    auplc-hub:
      name: ghcr.io/amdresearch/auplc-hub
      tag: latest
